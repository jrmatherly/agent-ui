name: Validate Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          experimental: true
          install_args: "--verbose"

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Validate
        run: mise run validate

      - name: Build
        run: mise run build
