{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-ui.fullname" . }}
  labels:
    {{- include "agent-ui.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.betterAuthSecret }}
  BETTER_AUTH_SECRET: {{ .Values.secrets.betterAuthSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.entraClientId }}
  ENTRA_CLIENT_ID: {{ .Values.secrets.entraClientId | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.entraClientSecret }}
  ENTRA_CLIENT_SECRET: {{ .Values.secrets.entraClientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.entraTenantId }}
  ENTRA_TENANT_ID: {{ .Values.secrets.entraTenantId | b64enc | quote }}
  {{- end }}
{{- end }}
