apiVersion: batch/v1
kind: Job
metadata:
  name: agent-ui-db-init
  labels:
    app: agent-ui
    component: db-init
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: agent-ui
        component: db-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: db-init
          image: agent-ui-db-init:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-ui-secrets
                  key: DATABASE_URL
            - name: DB_MAX_RETRIES
              value: '30'
            - name: DB_RETRY_INTERVAL
              value: '2'
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
